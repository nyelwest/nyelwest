<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nyelsu</title>
<meta name="description" content="Official website nyelsu.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="nyelsu">
<meta property="og:description" content="Official website nyelsu.">
<meta property="og:url" content="https://nyelwest.github.io/nyelwest/">
<meta property="og:image" content="https://nyelwest.github.io/nyelwest/avatar.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--ink:#fff;--mute:#9a9a9a;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:var(--ink);font-family:Poppins,system-ui,sans-serif}
#bg{position:fixed;inset:0;z-index:-2;background:center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.72)}
#snow{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{max-width:480px;margin:0 auto;padding:56px 20px 80px;text-align:center}
main:not(.go)>*{opacity:0}
main.go>*{animation:rise .6s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.28);box-shadow:0 0 36px rgba(255,255,255,.14)}
h1{font-size:1.8rem;font-weight:700;margin:18px 0 4px}
.tag{color:var(--mute);font-size:.9rem;margin:0 0 16px;min-height:1.4em}
.socials{display:flex;justify-content:center;gap:12px;margin-bottom:22px}
.socials a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:1.15rem;transition:background .15s,transform .15s}
.socials a:hover,.socials a:focus-visible{background:rgba(255,255,255,.14);transform:translateY(-2px);outline:none}
.profile{display:inline-block;max-width:100%;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:26px;line-height:1.5}
.handle{font-weight:600;font-size:.95rem}
.badge{margin-left:6px;padding:2px 8px;border-radius:6px;background:#fff;color:#000;font-size:.7rem;font-weight:700;vertical-align:middle}
.status{color:var(--mute);font-size:.82rem;overflow-wrap:anywhere}
.dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#747f8d}
.dot.online{background:#3ba55d}.dot.idle{background:#faa61a}.dot.dnd{background:#ed4245}
h2{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:30px 0 12px}
.link{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-align:left;padding:13px 16px;margin-bottom:10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none;transition:background .15s,transform .15s}
.link::before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
.link:hover::before{opacity:1}
.link:hover,.link:focus-visible{background:rgba(255,255,255,.1);transform:translateY(-2px);outline:none}
.ico{overflow:hidden;flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:1.1rem}
.link b{display:block;font-size:.95rem;font-weight:600}
.link span{display:block;color:var(--mute);font-size:.8rem}
.player{display:flex;align-items:center;gap:14px;margin-top:22px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left}
#pbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#000;font-size:.9rem;cursor:pointer}
#pbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pmid{flex:1;min-width:0}
.pmid b{display:block;margin-bottom:8px;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptrack{height:5px;border-radius:3px;background:rgba(255,255,255,.15);cursor:pointer;overflow:hidden}
#pfill{width:0;height:100%;background:#fff}
#bars{flex:none;width:72px;height:28px}
.ico img{width:100%;height:100%;object-fit:cover}
.banner{position:relative;height:132px;border-radius:18px;border:1px solid var(--line);overflow:hidden}
.banner+.avatar{display:block;margin:-58px auto 0;position:relative;border:4px solid #000}
.views{display:flex;width:fit-content;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.55);font-size:.75rem;color:#ddd}
.views.off{display:none}
.banner .views{position:absolute;top:10px;right:10px}
.link.has-banner{flex-direction:column;align-items:stretch;gap:0;padding:0}
.lb{height:88px;border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 16px}
footer{margin-top:40px;color:var(--mute);font-size:.8rem;line-height:1.7}
#splash{position:fixed;inset:0;z-index:10;width:100%;border:0;background:#000;color:#fff;font-family:inherit;cursor:pointer;transition:opacity .6s}
#splash small{display:block;color:var(--mute);font-size:.8rem;letter-spacing:.2em;margin-bottom:10px}
#splash span{display:block;font-size:1.15rem;font-weight:600;letter-spacing:.3em;animation:pulse 1.8s ease-in-out infinite}
#splash.out{opacity:0;pointer-events:none}
@keyframes pulse{50%{opacity:.3}}
#mute,#tglSnow{position:fixed;bottom:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;cursor:pointer;display:none}
#mute{right:16px}
#tglSnow{right:70px}
#tglSnow.off{opacity:.45}
#mute:focus-visible,#tglSnow:focus-visible{outline:2px solid #fff}
/* Mode "kurangi animasi" di OS: efek tetap jalan, hanya geser-naik diganti fade */
@media (prefers-reduced-motion:reduce){@keyframes rise{from{opacity:0}}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="snow"></canvas>
<button id="splash" type="button"><small id="splashTitle">Private Experience</small><span id="splashText">TAP ANYWHERE</span></button>
<main id="app"></main>
<button id="tglSnow" type="button" aria-label="Matikan salju" aria-pressed="true"><i class="fa-solid fa-snowflake"></i></button>
<button id="mute" type="button" aria-label="Matikan musik"><i class="fa-solid fa-volume-high"></i></button>

<!-- Kalau ada error di kode, pesannya tampil di layar (teks merah) -->
<script>
window.addEventListener("error", function (e) {
  var s = document.getElementById("splash");
  if (s) s.remove();
  var d = document.createElement("pre");
  d.style.cssText = "position:relative;z-index:20;color:#ff8a8a;padding:20px;white-space:pre-wrap;font:14px monospace";
  d.textContent = "Ada error di index.html: " + e.message + " (baris " + e.lineno + ")";
  document.body.appendChild(d);
});
</script>

<script>
/* ===== EDIT BAGIAN INI SAJA ===== */
const CONFIG = {
  name: "nyelsu",
  tagline: "yo watsap bradar.",
  avatar: "avatar.jpg",
  banner: "bag.jpg",                    // gambar lebar di atas profil; kosongkan kalau tidak mau
  viewsKey: "nyelwest_nyelsu_views",    // kunci unik penghitung views; kosongkan untuk mematikan
  background: "bag.jpg",
  music: "music.m4a",
  musicTitle: "Lagu favorit",           // judul yang tampil di player
  volume: 0.5,                          // 0 sampai 1
  player: true,                         // mini music player (butuh music di atas)
  tilt: true,                           // kartu miring 3D + kilau ikut kursor
  typewriter: true,                     // tagline diketik per huruf
  snow: true,
  discordId: "1145608106533982258",     // status Discord live (perlu join server Lanyard), kosongkan untuk mematikan
  splashTitle: "Nyel leluhur Getea Woi",
  splashText: "TAP ANYWHERE",
  handle: "",
  badge: "",
  status: "",
  socials: [
    { icon: "tiktok",  url: "https://tiktok.com/@nyelfvck" },
    { icon: "youtube", url: "https://youtube.com/@nyelsu" },
    { icon: "discord", url: "https://discord.com/users/1145608106533982258" }
  ],
  sections: [
    { title: "", links: [
      { icon: "fa-solid fa-link",     title: "Saweria",        desc: "Support admin",          url: "https://saweria.co/Rasya1st" },
      { icon: "fa-brands fa-discord", title: "TOMOMAJI SA-MP", desc: "Discord SAMP Community", url: "https://discord.gg/edvQjQtq" /* tambah: , banner: "tomomaji.jpg"  atau  , image: "logo.jpg" */ }
    ]},
    { title: "Community Partners", links: [
      { icon: "fa-brands fa-discord", title: "DM SAJA YANG MAU PARTNER", desc: "Komunitas samp", url: "https://discord.com/users/1145608106533982258" }
    ]}
  ]
};
/* ================================= */

const $ = id => document.getElementById(id);
function el(tag, cls, text, attrs) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function ext(a) { a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }

document.title = CONFIG.name;
$("splashTitle").textContent = CONFIG.splashTitle;
$("splashText").textContent = CONFIG.splashText;
if (CONFIG.background) $("bg").style.backgroundImage = 'url("' + CONFIG.background + '")';
else $("bg").style.display = "none";

const app = $("app");
let viewsEl = null;
if (CONFIG.viewsKey) {
  viewsEl = el("div", "views off");
  viewsEl.innerHTML = '<i class="fa-regular fa-eye"></i><span></span>';
}
if (CONFIG.banner) {
  const bn = el("div", "banner");
  bn.style.background = 'center/cover no-repeat url("' + CONFIG.banner + '"), linear-gradient(135deg,#2a2a2a,#0a0a0a)';
  if (viewsEl) bn.append(viewsEl);
  app.append(bn);
} else if (viewsEl) {
  viewsEl.style.margin = "0 auto 14px";
  app.append(viewsEl);
}
if (CONFIG.avatar) {
  const img = el("img", "avatar", "", { src: CONFIG.avatar, alt: CONFIG.name });
  img.onerror = () => img.remove();
  app.append(img);
}
const tag = el("p", "tag", CONFIG.typewriter ? "" : CONFIG.tagline);
app.append(el("h1", "", CONFIG.name), tag);

const soc = el("div", "socials");
CONFIG.socials.forEach(s => {
  const a = ext(el("a", "", "", { href: s.url, "aria-label": s.icon }));
  a.append(el("i", "fa-brands fa-" + s.icon));
  soc.append(a);
});
app.append(soc);

if (CONFIG.handle) {
  const p = el("div", "profile");
  const h = el("div", "handle", CONFIG.handle);
  if (CONFIG.badge) h.append(el("span", "badge", CONFIG.badge));
  p.append(h);
  if (CONFIG.status) p.append(el("div", "status", CONFIG.status));
  app.append(p);
}

CONFIG.sections.forEach(sec => {
  if (sec.title) app.append(el("h2", "", sec.title));
  sec.links.forEach(l => {
    const a = ext(el("a", "link" + (l.banner ? " has-banner" : ""), "", { href: l.url }));
    let row = a;
    if (l.banner) {
      const b = el("div", "lb");
      b.style.background = 'center/cover no-repeat url("' + l.banner + '"), #111';
      row = el("div", "lrow");
      a.append(b, row);
    }
    if (l.image) { const i = el("div", "ico"); i.append(el("img", "", "", { src: l.image, alt: "" })); row.append(i); }
    else if (l.icon) { const i = el("div", "ico"); i.append(el("i", l.icon)); row.append(i); }
    const t = el("div");
    t.append(el("b", "", l.title));
    if (l.desc) t.append(el("span", "", l.desc));
    row.append(t);
    app.append(a);
  });
});

/* Mini music player */
if (CONFIG.music && CONFIG.player) {
  const pl = el("div", "player");
  pl.innerHTML = '<button id="pbtn" type="button" aria-label="Putar atau jeda"><i class="fa-solid fa-play"></i></button>' +
    '<div class="pmid"><b></b><div id="ptrack"><div id="pfill"></div></div></div>' +
    '<canvas id="bars" width="72" height="28"></canvas>';
  pl.querySelector("b").textContent = CONFIG.musicTitle || "Now playing";
  app.append(pl);
}

const f = el("footer");
f.append("© " + new Date().getFullYear() + " " + CONFIG.name, document.createElement("br"), "");
app.append(f);

/* Kartu miring 3D + kilau ikut kursor (hanya untuk mouse) */
if (CONFIG.tilt && matchMedia("(hover:hover) and (pointer:fine)").matches) {
  app.addEventListener("pointermove", e => {
    const c = e.target.closest(".link");
    if (!c) return;
    const r = c.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    c.style.setProperty("--mx", px * 100 + "%");
    c.style.setProperty("--my", py * 100 + "%");
    c.style.transform = "perspective(700px) rotateX(" + (0.5 - py) * 10 + "deg) rotateY(" + (px - 0.5) * 12 + "deg) translateY(-2px)";
  });
  app.addEventListener("pointerout", e => {
    const c = e.target.closest(".link");
    if (c && !c.contains(e.relatedTarget)) c.style.transform = "";
  });
}

/* Status Discord live lewat Lanyard (gagal = bagian ini tidak muncul) */
(async function () {
  if (!CONFIG.discordId || CONFIG.handle) return;
  try {
    const r = await fetch("https://api.lanyard.rest/v1/users/" + CONFIG.discordId);
    const j = await r.json();
    if (!j.success) return;
    const d = j.data, u = d.discord_user || {};
    const act = (d.activities || []).find(a => a.type === 0);
    const custom = (d.activities || []).find(a => a.type === 4);
    const label = { online: "Online", idle: "Idle", dnd: "Do not disturb", offline: "Offline" };
    let line = label[d.discord_status] || "Offline";
    if (d.listening_to_spotify && d.spotify) line = "listen " + d.spotify.song + " by " + d.spotify.artist;
    else if (act) line = "play  " + act.name;
    else if (custom && custom.state) line = custom.state;
    const p = el("div", "profile");
    const h = el("div", "handle");
    h.append(el("span", "dot " + d.discord_status), u.global_name || u.username || CONFIG.name);
    p.append(h, el("div", "status", line));
    soc.after(p);
  } catch (e) { /* offline atau diblokir: abaikan */ }
})();

/* Salju di belakang konten: selalu bergerak, pelan kalau OS minta kurangi animasi, menghindari kursor */
(function () {
  if (!CONFIG.snow) return;
  const c = $("snow"), x = c.getContext("2d"), btn = $("tglSnow");
  const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const k = calm ? 0.35 : 1;
  let on = true, raf = 0, w, h, flakes = [];
  const mouse = { x: -999, y: -999 };
  try { on = localStorage.getItem("snow") !== "off"; } catch (e) {}
  const make = () => ({
    x: Math.random() * w, y: Math.random() * h, kx: 0, ky: 0,
    r: Math.random() * 2.4 + 0.8, v: Math.random() * 0.9 + 0.4,
    p: Math.random() * 6.28, s: Math.random() * 0.02 + 0.005, a: Math.random() * 0.5 + 0.4
  });
  function size() {
    const d = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    c.width = w * d; c.height = h * d;
    x.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.min(180, Math.round(w * h / 9000)) * (calm ? 0.6 : 1) | 0;
    while (flakes.length < n) flakes.push(make());
    flakes.length = Math.min(flakes.length, n);
  }
  function frame() {
    x.clearRect(0, 0, w, h);
    x.fillStyle = "#fff";
    for (const f of flakes) {
      f.p += f.s * k;
      f.y += f.v * k + f.ky;
      f.x += Math.sin(f.p) * 0.5 * k + f.kx;
      const dx = f.x - mouse.x, dy = f.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 10000 && d2 > 1) {
        const d = Math.sqrt(d2), push = (100 - d) / 100 * 1.6;
        f.kx += dx / d * push; f.ky += dy / d * push;
      }
      f.kx *= 0.92; f.ky *= 0.92;
      if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
      if (f.x > w + 5) f.x = -5;
      if (f.x < -5) f.x = w + 5;
      x.globalAlpha = f.a; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.283); x.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  function apply() {
    btn.classList.toggle("off", !on);
    btn.setAttribute("aria-pressed", on);
    btn.setAttribute("aria-label", on ? "Matikan salju" : "Nyalakan salju");
    cancelAnimationFrame(raf);
    if (on) frame(); else x.clearRect(0, 0, w, h);
  }
  addEventListener("resize", size);
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  const away = () => { mouse.x = mouse.y = -999; };
  document.documentElement.addEventListener("mouseleave", away);
  addEventListener("touchend", away);
  btn.addEventListener("click", () => {
    on = !on;
    try { localStorage.setItem("snow", on ? "on" : "off"); } catch (e) {}
    apply();
  });
  btn.style.display = "block";
  size(); apply();
})();

/* Penghitung views (layanan gratis countapi.mileshilliard.com; gagal = chip tidak muncul) */
if (viewsEl) (async function () {
  const base = "https://countapi.mileshilliard.com/api/v1/";
  const key = encodeURIComponent(CONFIG.viewsKey);
  let last = 0;
  try { last = +localStorage.getItem("viewedAt") || 0; } catch (e) {}
  const fresh = Date.now() - last > 12 * 36e5; // dihitung 1x per perangkat tiap 12 jam
  try {
    let r = await fetch(base + (fresh ? "hit/" : "get/") + key);
    if (!r.ok && !fresh) r = await fetch(base + "hit/" + key);
    const j = await r.json();
    if (j.value == null) return;
    if (fresh) { try { localStorage.setItem("viewedAt", String(Date.now())); } catch (e) {} }
    viewsEl.querySelector("span").textContent = Number(j.value).toLocaleString("id-ID");
    viewsEl.classList.remove("off");
  } catch (e) { /* layanan mati atau diblokir: abaikan */ }
})();

/* Splash, musik, dan player */
let audio = null, ctx = null, analyser = null, bRaf = 0;
const mute = $("mute"), bars = $("bars"), bx = bars ? bars.getContext("2d") : null;
if (CONFIG.music) {
  audio = new Audio(CONFIG.music);
  audio.loop = true;
  audio.volume = CONFIG.volume;
  mute.style.display = "block";
}
// Analyser untuk visualizer; dibuat setelah pengunjung mengetuk (aturan browser)
function initAudio() {
  if (ctx || !audio) return;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 64;
    src.connect(analyser);
    analyser.connect(ctx.destination);
  } catch (e) { ctx = null; analyser = null; }
}
function drawBars() {
  bx.clearRect(0, 0, 72, 28);
  bx.fillStyle = "#fff";
  const data = new Uint8Array(32);
  if (analyser) analyser.getByteFrequencyData(data);
  for (let i = 0; i < 12; i++) {
    const v = (data[i + 1] || 0) / 255, hgt = 3 + v * 25;
    bx.globalAlpha = 0.35 + v * 0.65;
    bx.fillRect(i * 6, 28 - hgt, 4, hgt);
  }
  if (audio && !audio.paused) bRaf = requestAnimationFrame(drawBars);
}
function syncMute() {
  const on = audio && !audio.paused;
  mute.innerHTML = '<i class="fa-solid ' + (on ? "fa-volume-high" : "fa-volume-xmark") + '"></i>';
  mute.setAttribute("aria-label", on ? "Matikan musik" : "Nyalakan musik");
  const pi = document.querySelector("#pbtn i");
  if (pi) pi.className = "fa-solid " + (on ? "fa-pause" : "fa-play");
  if (bx) { cancelAnimationFrame(bRaf); if (on) drawBars(); else bx.clearRect(0, 0, 72, 28); }
}
function toggleMusic() {
  if (!audio) return;
  initAudio();
  if (ctx) ctx.resume();
  audio.paused ? audio.play() : audio.pause();
}
// Animasi masuk berurutan + tagline diketik, dimulai setelah layar pembuka diketuk
function startEntrance() {
  [...app.children].forEach((c, i) => { c.style.animationDelay = i * 80 + "ms"; });
  app.classList.add("go");
  if (CONFIG.typewriter) {
    let i = 0;
    (function step() {
      tag.textContent = CONFIG.tagline.slice(0, ++i);
      if (i < CONFIG.tagline.length) setTimeout(step, 65);
    })();
  }
}
$("splash").addEventListener("click", () => {
  $("splash").classList.add("out");
  startEntrance();
  if (audio) {
    initAudio();
    if (ctx) ctx.resume();
    audio.play().catch(syncMute);
  }
});
mute.addEventListener("click", toggleMusic);
if (audio) {
  audio.addEventListener("play", syncMute);
  audio.addEventListener("pause", syncMute);
  const pb = $("pbtn"), tr = $("ptrack"), fl = $("pfill");
  if (pb) {
    pb.addEventListener("click", toggleMusic);
    audio.addEventListener("timeupdate", () => {
      fl.style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + "%";
    });
    tr.addEventListener("click", e => {
      const r = tr.getBoundingClientRect();
      if (isFinite(audio.duration)) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
    });
  }
}
syncMute();
</script>
</body>
</html>
